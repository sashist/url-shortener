<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortener — Fast & Minimalist URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 font-sans min-h-screen flex flex-col transition-colors duration-150 selection:bg-zinc-200 dark:selection:bg-zinc-800">

  <!-- Top Navigation Bar -->
  <header class="border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <!-- Brand -->
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 rounded bg-zinc-900 dark:bg-zinc-100 flex items-center justify-center text-white dark:text-zinc-950">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <span class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">
          shortener<span class="text-zinc-400 dark:text-zinc-600">.dev</span>
        </span>
      </div>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="w-8 h-8 flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition" aria-label="Toggle theme">
          <!-- Sun Icon (for dark mode) -->
          <svg id="theme-sun-icon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (for light mode) -->
          <svg id="theme-moon-icon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Auth Status Elements -->
        <div id="nav-user-panel" class="flex items-center gap-3 text-xs">
          <span id="nav-user-email" class="text-zinc-500 dark:text-zinc-400 font-mono hidden"></span>
          <button id="nav-logout-btn" class="hidden px-2.5 py-1.5 rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition font-medium">
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-10 flex flex-col">

    <!-- Auth View (Shown when not authenticated) -->
    <div id="view-auth" class="my-auto max-w-sm w-full mx-auto space-y-6">
      <div class="text-center space-y-1">
        <h1 class="text-xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100" id="auth-heading">Sign in</h1>
        <p class="text-xs text-zinc-500 dark:text-zinc-400" id="auth-subheading">Enter your email to manage your shortened links</p>
      </div>

      <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-6 shadow-sm">
        <!-- Tabs -->
        <div class="flex p-1 bg-zinc-100 dark:bg-zinc-950 rounded-lg border border-zinc-200/80 dark:border-zinc-800/80 mb-5 text-xs">
          <button id="tab-login" class="flex-1 py-1.5 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-800 shadow-sm transition">Sign in</button>
          <button id="tab-register" class="flex-1 py-1.5 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">Register</button>
        </div>

        <form id="form-auth" class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300">Email address</label>
            <input type="email" id="input-email" required class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:border-zinc-900 dark:focus:border-zinc-400 focus:ring-1 focus:ring-zinc-900 dark:focus:ring-zinc-400 transition" placeholder="you@example.com">
          </div>

          <div class="space-y-1.5">
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300">Password</label>
            <input type="password" id="input-password" required minlength="4" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:border-zinc-900 dark:focus:border-zinc-400 focus:ring-1 focus:ring-zinc-900 dark:focus:ring-zinc-400 transition" placeholder="••••••••">
          </div>

          <div id="auth-error-box" class="text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-lg p-2.5 hidden font-mono"></div>

          <button type="submit" id="btn-auth-submit" class="w-full bg-zinc-900 hover:bg-zinc-800 dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-zinc-950 font-medium text-xs py-2.5 rounded-lg transition shadow-sm">
            Sign in
          </button>
        </form>
      </div>
    </div>

    <!-- Dashboard View (Shown when authenticated) -->
    <div id="view-dashboard" class="hidden space-y-8">
      
      <!-- Shorten Input Box -->
      <section class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-4 sm:p-5 shadow-sm space-y-3">
        <form id="form-shorten" class="flex flex-col sm:flex-row gap-2">
          <div class="relative flex-1">
            <input 
              type="text" 
              id="input-url" 
              required 
              placeholder="Paste destination URL (e.g. chat.deepseek.com or https://...)"
              class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg pl-3 pr-3 py-2 text-xs sm:text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:border-zinc-900 dark:focus:border-zinc-400 focus:ring-1 focus:ring-zinc-900 dark:focus:ring-zinc-400 transition font-mono"
            >
          </div>
          <button 
            type="submit" 
            class="bg-zinc-900 hover:bg-zinc-800 dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-zinc-950 font-medium text-xs px-5 py-2.5 rounded-lg transition shrink-0 flex items-center justify-center gap-1.5 shadow-sm"
          >
            <span>Shorten URL</span>
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Banner for Newly Created Link -->
        <div id="box-new-link" class="hidden p-3 bg-zinc-100 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg flex items-center justify-between gap-3 text-xs">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
            <span class="text-zinc-500 dark:text-zinc-400 shrink-0 font-medium">Link ready:</span>
            <a id="new-link-anchor" href="#" target="_blank" class="font-mono text-zinc-900 dark:text-zinc-100 font-semibold hover:underline truncate"></a>
          </div>
          <button id="btn-copy-new-link" class="px-3 py-1.5 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-zinc-800 dark:text-zinc-200 font-mono text-[11px] rounded-md hover:bg-zinc-50 dark:hover:bg-zinc-700 transition font-medium shrink-0 flex items-center gap-1">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>
      </section>

      <!-- Links List Section -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Links</h2>
            <span id="badge-total-links" class="font-mono text-[11px] px-2 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">0</span>
          </div>
          <button id="btn-refresh-links" class="text-xs text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-200 transition flex items-center gap-1">
            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Refresh</span>
          </button>
        </div>

        <!-- Links Container -->
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl overflow-hidden shadow-sm divide-y divide-zinc-100 dark:divide-zinc-800" id="container-links-list">
          <div class="p-10 text-center text-xs text-zinc-400 font-mono">Loading links...</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Analytics Drawer Modal -->
  <div id="modal-analytics" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl max-w-lg w-full p-5 sm:p-6 space-y-5 shadow-xl text-zinc-900 dark:text-zinc-100">
      
      <!-- Modal Header -->
      <div class="flex items-start justify-between border-b border-zinc-100 dark:border-zinc-800 pb-3">
        <div class="space-y-0.5">
          <div class="flex items-center gap-2">
            <span class="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">Analytics</span>
            <span id="modal-shortcode-badge" class="font-mono text-xs px-2 py-0.5 bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 rounded font-medium"></span>
          </div>
          <div id="modal-target-url-text" class="text-xs text-zinc-500 font-mono truncate max-w-sm"></div>
        </div>
        <button id="modal-close-btn" class="p-1 text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition rounded">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="p-3 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg">
          <div class="text-[11px] text-zinc-500 font-medium">Total Clicks</div>
          <div id="metric-total-clicks" class="text-xl font-semibold font-mono mt-0.5">0</div>
        </div>
        <div class="p-3 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg">
          <div class="text-[11px] text-zinc-500 font-medium">Top Browser</div>
          <div id="metric-top-browser" class="text-sm font-semibold truncate mt-0.5">-</div>
        </div>
      </div>

      <!-- Browser Distribution Breakdown -->
      <div class="space-y-2">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Browser Distribution</div>
        <div id="modal-browser-bars-list" class="space-y-1.5"></div>
      </div>

      <!-- Click Event Activity Log -->
      <div class="space-y-2">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Recent Visits</div>
        <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg max-h-40 overflow-y-auto bg-zinc-50 dark:bg-zinc-950">
          <table class="w-full text-left text-[11px] font-mono">
            <thead class="bg-zinc-100 dark:bg-zinc-900 text-zinc-500 border-b border-zinc-200 dark:border-zinc-800 sticky top-0">
              <tr>
                <th class="px-3 py-2 font-medium">Timestamp</th>
                <th class="px-3 py-2 font-medium">Browser</th>
                <th class="px-3 py-2 font-medium">Country</th>
              </tr>
            </thead>
            <tbody id="modal-activity-log-body" class="divide-y divide-zinc-200/50 dark:divide-zinc-800/50 text-zinc-600 dark:text-zinc-400">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    let isRegisterMode = false;

    // Theme Management
    const themeToggleBtn = document.getElementById("theme-toggle-btn");
    const themeSunIcon = document.getElementById("theme-sun-icon");
    const themeMoonIcon = document.getElementById("theme-moon-icon");

    function initTheme() {
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
        themeSunIcon.classList.remove("hidden");
        themeMoonIcon.classList.add("hidden");
      } else {
        document.documentElement.classList.remove("dark");
        themeSunIcon.classList.add("hidden");
        themeMoonIcon.classList.remove("hidden");
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      themeSunIcon.classList.toggle("hidden", !isDark);
      themeMoonIcon.classList.toggle("hidden", isDark);
    });

    initTheme();

    // DOM Elements
    const viewAuth = document.getElementById("view-auth");
    const viewDashboard = document.getElementById("view-dashboard");
    const navUserEmail = document.getElementById("nav-user-email");
    const navLogoutBtn = document.getElementById("nav-logout-btn");

    const authHeading = document.getElementById("auth-heading");
    const authSubheading = document.getElementById("auth-subheading");
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formAuth = document.getElementById("form-auth");
    const inputEmail = document.getElementById("input-email");
    const inputPassword = document.getElementById("input-password");
    const btnAuthSubmit = document.getElementById("btn-auth-submit");
    const authErrorBox = document.getElementById("auth-error-box");

    const formShorten = document.getElementById("form-shorten");
    const inputUrl = document.getElementById("input-url");
    const boxNewLink = document.getElementById("box-new-link");
    const newLinkAnchor = document.getElementById("new-link-anchor");
    const btnCopyNewLink = document.getElementById("btn-copy-new-link");
    const badgeTotalLinks = document.getElementById("badge-total-links");
    const containerLinksList = document.getElementById("container-links-list");
    const btnRefreshLinks = document.getElementById("btn-refresh-links");

    const modalAnalytics = document.getElementById("modal-analytics");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const modalShortcodeBadge = document.getElementById("modal-shortcode-badge");
    const modalTargetUrlText = document.getElementById("modal-target-url-text");
    const metricTotalClicks = document.getElementById("metric-total-clicks");
    const metricTopBrowser = document.getElementById("metric-top-browser");
    const modalBrowserBarsList = document.getElementById("modal-browser-bars-list");
    const modalActivityLogBody = document.getElementById("modal-activity-log-body");

    // Token Utilities
    function getToken() { return localStorage.getItem("token"); }
    function setToken(token) { localStorage.setItem("token", token); }
    function clearToken() { localStorage.removeItem("token"); }

    // Init & Auth Check
    async function init() {
      const token = getToken();
      if (!token) {
        showAuth();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/v1/auth/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          const user = await res.json();
          showDashboard(user.email);
          loadLinks();
        } else {
          clearToken();
          showAuth();
        }
      } catch (err) {
        showAuth();
      }
    }

    function showAuth() {
      viewAuth.classList.remove("hidden");
      viewDashboard.classList.add("hidden");
      navUserEmail.classList.add("hidden");
      navLogoutBtn.classList.add("hidden");
    }

    function showDashboard(email) {
      viewAuth.classList.add("hidden");
      viewDashboard.classList.remove("hidden");
      navUserEmail.textContent = email;
      navUserEmail.classList.remove("hidden");
      navLogoutBtn.classList.remove("hidden");
    }

    // Tabs
    tabLogin.addEventListener("click", () => {
      isRegisterMode = false;
      tabLogin.className = "flex-1 py-1.5 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-800 shadow-sm transition";
      tabRegister.className = "flex-1 py-1.5 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition";
      authHeading.textContent = "Sign in";
      authSubheading.textContent = "Enter your email to manage your shortened links";
      btnAuthSubmit.textContent = "Sign in";
      authErrorBox.classList.add("hidden");
    });

    tabRegister.addEventListener("click", () => {
      isRegisterMode = true;
      tabRegister.className = "flex-1 py-1.5 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-800 shadow-sm transition";
      tabLogin.className = "flex-1 py-1.5 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition";
      authHeading.textContent = "Create an account";
      authSubheading.textContent = "Get started with your personal shortener in seconds";
      btnAuthSubmit.textContent = "Create account";
      authErrorBox.classList.add("hidden");
    });

    // Auth Submit
    formAuth.addEventListener("submit", async (e) => {
      e.preventDefault();
      authErrorBox.classList.add("hidden");
      const email = inputEmail.value.trim();
      const password = inputPassword.value;

      try {
        const endpoint = isRegisterMode ? "/api/v1/auth/register" : "/api/v1/auth/login";
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const err = await res.json();
          authErrorBox.textContent = err.detail || "Authentication error";
          authErrorBox.classList.remove("hidden");
          return;
        }

        if (isRegisterMode) {
          const loginRes = await fetch(`${API_BASE}/api/v1/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const loginData = await loginRes.json();
          setToken(loginData.access_token);
        } else {
          const data = await res.json();
          setToken(data.access_token);
        }

        init();
      } catch (err) {
        authErrorBox.textContent = "Network error connecting to backend";
        authErrorBox.classList.remove("hidden");
      }
    });

    navLogoutBtn.addEventListener("click", async () => {
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, {
          method: "POST",
          credentials: "include"
        });
      } catch (e) {}
      clearToken();
      showAuth();
    });


    // Shorten Form
    formShorten.addEventListener("submit", async (e) => {
      e.preventDefault();
      const originalUrl = inputUrl.value.trim();
      const token = getToken();

      try {
        const res = await fetch(`${API_BASE}/api/v1/links/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ original_url: originalUrl })
        });

        if (res.ok) {
          const data = await res.json();
          const shortUrl = `${API_BASE}/${data.short_code}`;
          newLinkAnchor.textContent = shortUrl;
          newLinkAnchor.href = shortUrl;
          boxNewLink.classList.remove("hidden");
          inputUrl.value = "";
          loadLinks();
        } else {
          alert("Error: Please provide a valid URL format (e.g. https://example.com)");
        }
      } catch (err) {
        alert("Connection error occurred.");
      }
    });

    btnCopyNewLink.addEventListener("click", () => {
      navigator.clipboard.writeText(newLinkAnchor.textContent);
      btnCopyNewLink.querySelector("span").textContent = "Copied!";
      setTimeout(() => { btnCopyNewLink.querySelector("span").textContent = "Copy"; }, 1500);
    });

    // Load Links
    async function loadLinks() {
      const token = getToken();
      try {
        const res = await fetch(`${API_BASE}/api/v1/links/`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          const links = await res.json();
          renderLinks(links);
        }
      } catch (err) {
        containerLinksList.innerHTML = `<div class="p-8 text-center text-xs text-red-500 font-mono">Failed to fetch links list</div>`;
      }
    }

    function renderLinks(links) {
      badgeTotalLinks.textContent = links.length;
      if (!links || links.length === 0) {
        containerLinksList.innerHTML = `
          <div class="p-12 text-center space-y-1">
            <div class="text-xs text-zinc-500 dark:text-zinc-400 font-medium">No links created yet</div>
            <div class="text-[11px] text-zinc-400 dark:text-zinc-600">Enter a URL above to create your first short link</div>
          </div>
        `;
        return;
      }

      containerLinksList.innerHTML = links.map(link => {
        const fullShortUrl = `${API_BASE}/${link.short_code}`;
        const dateStr = link.created_at ? new Date(link.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "-";
        const isActive = link.is_active !== false;
        
        return `
          <div class="p-4 hover:bg-zinc-50 dark:hover:bg-zinc-950/40 transition flex items-center justify-between gap-4 ${!isActive ? 'opacity-60' : ''}">
            <div class="min-w-0 space-y-1">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full ${isActive ? 'bg-emerald-500' : 'bg-zinc-400'}" title="${isActive ? 'Active' : 'Disabled'}"></span>
                <a href="${fullShortUrl}" target="_blank" class="font-mono text-xs font-semibold ${isActive ? 'text-zinc-900 dark:text-zinc-100 hover:underline' : 'text-zinc-500 line-through'} flex items-center gap-1">
                  ${fullShortUrl}
                  <svg class="w-3 h-3 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>
                <span class="text-[10px] text-zinc-400 dark:text-zinc-600 font-mono">${dateStr}</span>
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${isActive ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'bg-zinc-200 dark:bg-zinc-800 text-zinc-500'}">${isActive ? 'Active' : 'Paused'}</span>
              </div>
              <div class="text-[11px] text-zinc-500 dark:text-zinc-400 font-mono truncate max-w-md sm:max-w-lg" title="${link.original_url}">
                ${link.original_url}
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button onclick="toggleLinkStatus(${link.id}, ${isActive}, this)" class="text-xs text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-zinc-100 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-2.5 py-1.5 rounded-lg transition font-mono text-[11px] font-medium" title="${isActive ? 'Pause link' : 'Activate link'}">
                <span>${isActive ? 'Pause' : 'Activate'}</span>
              </button>
              <button onclick="copyToClipboard('${fullShortUrl}', this)" class="text-xs text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-zinc-100 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 font-mono text-[11px] font-medium">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span>Copy</span>
              </button>
              <button onclick="openStatsModal('${link.short_code}', '${encodeURIComponent(link.original_url)}')" class="text-xs text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-zinc-100 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 font-mono text-[11px] font-medium">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span>Stats</span>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.toggleLinkStatus = async function(linkId, currentStatus, btn) {
      const token = getToken();
      const newStatus = !currentStatus;
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/v1/links/${linkId}?state=${newStatus}`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          loadLinks();
        } else {
          alert("Failed to update link status");
        }
      } catch (err) {
        alert("Connection error");
      } finally {
        btn.disabled = false;
      }
    };

    window.copyToClipboard = function(text, btn) {
      navigator.clipboard.writeText(text);
      const span = btn.querySelector("span");
      span.textContent = "Copied!";
      setTimeout(() => { span.textContent = "Copy"; }, 1500);
    };

    btnRefreshLinks.addEventListener("click", loadLinks);

    // Analytics Modal
    window.openStatsModal = async function(shortCode, originalUrlEncoded) {
      const token = getToken();
      modalShortcodeBadge.textContent = shortCode;
      modalTargetUrlText.textContent = decodeURIComponent(originalUrlEncoded);
      metricTotalClicks.textContent = "...";
      metricTopBrowser.textContent = "...";
      modalBrowserBarsList.innerHTML = `<div class="text-[11px] text-zinc-400 font-mono">Loading data...</div>`;
      modalActivityLogBody.innerHTML = `<tr><td colspan="3" class="px-3 py-4 text-center text-zinc-400 font-mono">Loading activity...</td></tr>`;
      
      modalAnalytics.classList.remove("hidden");
      modalAnalytics.classList.add("flex");

      try {
        const res = await fetch(`${API_BASE}/api/v1/links/${shortCode}/stats`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (res.ok) {
          const clicks = await res.json();
          metricTotalClicks.textContent = clicks.length;

          // Aggregates
          const browserMap = {};
          clicks.forEach(c => {
            const b = c.browser || "Unknown";
            browserMap[b] = (browserMap[b] || 0) + 1;
          });

          const sortedBrowsers = Object.entries(browserMap).sort((a, b) => b[1] - a[1]);
          metricTopBrowser.textContent = sortedBrowsers.length > 0 ? `${sortedBrowsers[0][0]} (${sortedBrowsers[0][1]})` : "No visits";

          // Browser progress bars
          if (sortedBrowsers.length === 0) {
            modalBrowserBarsList.innerHTML = `<div class="text-[11px] text-zinc-500 font-mono">No browser data</div>`;
          } else {
            modalBrowserBarsList.innerHTML = sortedBrowsers.map(([name, count]) => {
              const pct = Math.round((count / clicks.length) * 100);
              return `
                <div class="space-y-1 font-mono text-[11px]">
                  <div class="flex justify-between text-zinc-500 dark:text-zinc-400">
                    <span>${name}</span>
                    <span>${count} (${pct}%)</span>
                  </div>
                  <div class="w-full bg-zinc-200 dark:bg-zinc-800 rounded-full h-1.5 overflow-hidden">
                    <div class="bg-zinc-800 dark:bg-zinc-200 h-1.5 rounded-full" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join("");
          }

          // Activity logs
          if (clicks.length === 0) {
            modalActivityLogBody.innerHTML = `<tr><td colspan="3" class="px-3 py-6 text-center text-zinc-500 font-mono">No clicks recorded yet</td></tr>`;
          } else {
            modalActivityLogBody.innerHTML = clicks.map(c => {
              const time = c.created_at ? new Date(c.created_at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
              return `
                <tr class="hover:bg-zinc-100/50 dark:hover:bg-zinc-900/50 transition">
                  <td class="px-3 py-2 text-zinc-500 dark:text-zinc-400">${time}</td>
                  <td class="px-3 py-2 font-medium text-zinc-900 dark:text-zinc-200">${c.browser || "Unknown"}</td>
                  <td class="px-3 py-2 text-zinc-500">${c.country || "Local / Dev"}</td>
                </tr>
              `;
            }).join("");
          }
        }
      } catch (err) {
        modalActivityLogBody.innerHTML = `<tr><td colspan="3" class="px-3 py-4 text-center text-red-500 font-mono">Failed to fetch stats</td></tr>`;
      }
    };

    modalCloseBtn.addEventListener("click", () => {
      modalAnalytics.classList.add("hidden");
      modalAnalytics.classList.remove("flex");
    });

    modalAnalytics.addEventListener("click", (e) => {
      if (e.target === modalAnalytics) {
        modalAnalytics.classList.add("hidden");
        modalAnalytics.classList.remove("flex");
      }
    });

    init();
  </script>
</body>
</html>
